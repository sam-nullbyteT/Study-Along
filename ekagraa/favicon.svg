<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Ambient Glass Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14192b" />
      <stop offset="100%" stop-color="#090b14" />
    </linearGradient>

    <!-- Warm Amber Glow -->
    <linearGradient id="orb-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Cyan / Violet Focus Glow -->
    <linearGradient id="orb-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Rim Light Gradient -->
    <linearGradient id="rim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Glass Base Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)" stroke="url(#rim-grad)" stroke-width="1.8" />

  <!-- Inner Ambient Aura -->
  <circle cx="32" cy="32" r="22" fill="#fdba74" opacity="0.12" filter="url(#glow)" />

  <!-- Core Zen Focus Orbs (Ekagraa: Singular Point of Concentration) -->
  <!-- Primary Central Focus Orb -->
  <circle cx="32" cy="32" r="11" fill="url(#orb-grad1)" filter="url(#glow)" />
  <circle cx="28.5" cy="28.5" r="3.2" fill="#ffffff" opacity="0.75" />

  <!-- Harmony Satellite Orb 1 (Top-Right: Deep Focus) -->
  <circle cx="43" cy="21" r="5.5" fill="url(#orb-grad2)" opacity="0.9" filter="url(#glow)" />
  <circle cx="41.5" cy="19.5" r="1.6" fill="#ffffff" opacity="0.8" />

  <!-- Harmony Satellite Orb 2 (Bottom-Left: Calm Flow) -->
  <circle cx="21" cy="43" r="4.5" fill="url(#orb-grad2)" opacity="0.85" filter="url(#glow)" />

  <!-- Delicate Focus Wave Arc -->
  <path d="M 18 24 A 18 18 0 0 1 46 40" fill="none" stroke="url(#rim-grad)" stroke-width="1.6" stroke-linecap="round" opacity="0.45" />
</svg>
